name: Cloudflare migration unit tests
on:
  push:
    branches:
      - migration/cloudflare-backend
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloudflare-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked Cloudflare dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run all Cloudflare migration unit tests
        run: npm test
      - name: Check Worker module imports
        run: node -e "import('./worker.js').then(() => console.log('Worker module loaded'))"
